server {
    listen 80;
    server_name smartwardrobe.store www.smartwardrobe.store;

    # Root directory for the React build files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Redirect all non-existing routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smartwardrobe.store www.smartwardrobe.store;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/smartwardrobe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartwardrobe.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;

    # Root directory for the React build files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Redirect all non-existing routes to index.html (for React's client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Optional: Custom error page for 404
    error_page 404 /index.html;
}
