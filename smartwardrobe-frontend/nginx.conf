# HTTP server block - Redirect to HTTPS
server {
    listen 80;
    server_name smartwardrobe.store www.smartwardrobe.store;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl http2;
    server_name smartwardrobe.store www.smartwardrobe.store;

    # SSL certificate and key (generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/smartwardrobe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartwardrobe.store/privkey.pem;

    # SSL settings (recommended for security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20-POLY1305-SHA256';
    ssl_prefer_server_ciphers on;

    # SSL Session Settings (cache session state to optimize performance)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Add additional security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Root directory for the React build files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (js, css, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional: Custom error page for 404
    error_page 404 /index.html;

    # Optional: Disable .htaccess files (if any) for added security
    location ~ /\.ht {
        deny all;
    }
}

# Optional: Add a redirect from www to non-www
server {
    listen 443 ssl http2;
    server_name www.smartwardrobe.store;

    ssl_certificate /etc/letsencrypt/live/smartwardrobe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartwardrobe.store/privkey.pem;

    return 301 https://smartwardrobe.store$request_uri;
}
