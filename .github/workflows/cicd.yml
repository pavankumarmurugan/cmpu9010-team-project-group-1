name: CICD

on:
  push:
    branches:
      - develop
    paths:
      - "smartwardrobe-frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to docker hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1"
      - name: Download SSL certificates from S3
        run: |
          aws s3 cp s3://sw-uploads-img/fullchain.pem /tmp/fullchain.pem
          aws s3 cp s3://sw-uploads-img/privkey.pem /tmp/privkey.pem
      - name: Build Docker Image
        working-directory: ./smartwardrobe-frontend
        run: docker build --build-arg CERT_PATH=/tmp --tag d23124670/smartwardrobe-app .
#        run: docker build -t d23124670/smartwardrobe-frontend .
      - name: Publish image to docker hub
        run: docker push d23124670/smartwardrobe-frontend:latest
  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Pull image from docker hub
        run: docker pull d23124670/smartwardrobe-frontend:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run docker container
        run: docker run -d -p 3000:80 --name reactContainer d23124670/smartwardrobe-frontend:latest
