name: CICD

on:
  push:
    branches:
      - develop
    paths:
      - "smartwardrobe-frontend/**"
  workflow_dispatch:

env:
  DOCKER_IMAGE: d23124670/smartwardrobe-frontend
  DOCKER_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        working-directory: ./smartwardrobe-frontend
        run: npm install

      - name: Build Docker Image
        working-directory: ./smartwardrobe-frontend
        run: docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Publish Image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker Image from Docker Hub
        run: docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Stop Old Container (Ignore if not exists)
        run: |
          docker rm -f reactContainer || echo "No existing container to delete"

      - name: Run Docker Container
        run: docker run -d -p 3000:80 --name reactContainer ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Verify Deployment
        run: curl -f http://localhost:3000 || echo "Deployment failed or application not responding"
