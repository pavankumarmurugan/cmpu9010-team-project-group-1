name: CICD-vector-search

on:
  push:
    branches:
      - develop
    paths:
      - "../../smartwardrobe-AI/vector-search-v2"
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to docker hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build Docker Image
        working-directory: ./smartwardrobe-AI/vector-search-v2
        run: docker build -t d23124670/vector-search .
      - name: Publish image to docker hub
        run: docker push d23124670/vector-search:latest
  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Pull image from docker hub
        run: docker pull d23124670/vector-search:latest
      - name: Delete Old Container
        run: docker rm -f CN-vector-search
      - name: Delete Old Image
        run: docker rmi -f d23124670/vector-search:latest
      - name: Run docker container
        run: docker run -d -p 5000:5000 --name CN-vector-search -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} d23124670/vector-search:latest
