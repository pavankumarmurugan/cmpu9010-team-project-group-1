name: Build and deploy Node.js app to Azure Web App - smartwardrobe-backend

on:
  push:
    branches:
      - develop
    paths:
      - "smartwardrobe-backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm" # Enable npm cache
          cache-dependency-path: smartwardrobe-backend/package-lock.json

      # Cache the node_modules to speed up builds
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: smartwardrobe-backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('smartwardrobe-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies and build
        working-directory: smartwardrobe-backend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build --if-present
          npm prune --production  # Remove dev dependencies

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            smartwardrobe-backend/dist
            smartwardrobe-backend/node_modules
            smartwardrobe-backend/package.json
            !smartwardrobe-backend/node_modules/.cache
          compression-level: 9 # Maximum compression
          retention-days: 1 # Reduce storage usage

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 120
    environment:
      name: "Development"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: smartwardrobe-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "smartwardrobe-backend"
          slot-name: "production"
          package: smartwardrobe-backend
          restart: true
