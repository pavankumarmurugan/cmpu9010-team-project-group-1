name: Build and deploy Node.js app to Azure Web App - smartwardrobe-backend

on:
  push:
    branches:
      - develop
    paths:
      - "smartwardrobe-backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies and build
        run: |
          cd smartwardrobe-backend
          npm ci
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: smartwardrobe-backend # Uploads the full directory

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: smartwardrobe-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App via Zip
        run: |
          cd smartwardrobe-backend
          zip -r app.zip .
          az webapp deployment source config-zip \
            --resource-group sw-europe \
            --name smartwardrobe-backend \
            --src app.zip
