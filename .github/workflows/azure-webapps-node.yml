name: Build, Test, and Deploy Node.js app to Azure Web App - smartwardrobe-backend

on:
  push:
    branches:
      - develop
    paths:
      - "smartwardrobe-backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: |
          cd smartwardrobe-backend
          npm install

      - name: Build application
        run: |
          cd smartwardrobe-backend
          npm run build --if-present

      - name: Zip artifact for deployment
        run: |
          cd smartwardrobe-backend
          zip -r ../release.zip .

      - name: Upload artifact for test and deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for testing
        run: unzip release.zip

      - name: Check directory contents
        run: ls -R # List contents recursively to verify structure

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: |
          # Adjust directory path based on structure observed in previous step
          cd smartwardrobe-backend || echo "Already in correct directory" 
          npm install

      - name: Set environment variables for tests
        env:
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_TYPE: "postgres"
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: echo "Environment variables set"

      - name: Run tests
        run: |
          # Adjust path based on structure, if needed
          cd smartwardrobe-backend || echo "Already in correct directory"
          npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: "Development"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "smartwardrobe-backend"
          slot-name: "production"
          package: .
